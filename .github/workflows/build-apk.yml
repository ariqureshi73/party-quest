name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Create minimal Android project
        run: |
          mkdir -p twa
          cd twa
          
          # Create minimal AndroidManifest.xml for web wrapper
          mkdir -p src/main
          cat > src/main/AndroidManifest.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="app.partyquest.ttrpg">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Party Quest"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF
          
          # Create build.gradle
          cat > build.gradle << 'GRADLEEOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'app.partyquest.ttrpg'
              compileSdk 34
              
              defaultConfig {
                  applicationId "app.partyquest.ttrpg"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              signingConfigs {
                  release {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/partyquest.keystore')
                      storePassword 'partyquest123'
                      keyAlias 'partyquest'
                      keyPassword 'partyquest123'
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          GRADLEEOF

      - name: Build APK with Gradle
        working-directory: twa
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx2048m"

      - name: List build outputs
        run: |
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: "twa/**/release/*.apk"
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore (save this!)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
