name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          sdkmanager --licenses < /dev/null || true

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Create minimal Gradle Android project
        run: |
          mkdir -p android-app/app/src/main/{res/values,assets}
          
          cat > android-app/settings.gradle << 'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "PartyQuest"
          include ':app'
          GRADLE
          
          cat > android-app/build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          GRADLE
          
          cat > android-app/app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'app.partyquest.ttrpg'
              compileSdk 34
              
              defaultConfig {
                  applicationId 'app.partyquest.ttrpg'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              
              signingConfigs {
                  release {
                      storeFile file('${{ github.workspace }}/partyquest.keystore')
                      storePassword 'partyquest123'
                      keyAlias 'partyquest'
                      keyPassword 'partyquest123'
                  }
              }
          }
          GRADLE
          
          cat > android-app/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="app.partyquest.ttrpg">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Party Quest"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          
          mkdir -p android-app/app/src/main/java/app/partyquest/ttrpg
          cat > android-app/app/src/main/java/app/partyquest/ttrpg/MainActivity.kt << 'KOTLIN'
          package app.partyquest.ttrpg
          
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                  }
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("https://ariqureshi73.github.io/party-quest/")
                  
                  setContentView(webView)
              }
          }
          KOTLIN
          
          cat > android-app/app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Party Quest</string>
          </resources>
          XML

      - name: Build APK (Gradle)
        working-directory: ./android-app
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon 2>&1 || gradle assembleRelease

      - name: List build outputs
        run: |
          find . -name "*.apk" -type f
          find . -name "*.aab" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
