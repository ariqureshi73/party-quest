name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Create Cordova project
        run: cordova create partyquest app.partyquest.ttrpg "Party Quest"

      - name: Copy web files
        run: |
          cp index.html partyquest/www/
          cp manifest.json partyquest/www/
          mkdir -p partyquest/www/assets
          cp -r assets/* partyquest/www/assets/ || true

      - name: Add Android platform
        working-directory: ./partyquest
        run: cordova platform add android

      - name: Configure signing
        run: |
          cat > partyquest/build.json << 'JSON'
          {
            "android": {
              "release": {
                "keystore": "partyquest.keystore",
                "storePassword": "partyquest123",
                "alias": "partyquest",
                "password": "partyquest123",
                "keystorePath": "$GITHUB_WORKSPACE"
              }
            }
          }
          JSON

      - name: Build APK (release)
        working-directory: ./partyquest
        run: cordova build android --release -- --storePassword=partyquest123 --password=partyquest123 --keystore=$GITHUB_WORKSPACE/partyquest.keystore --alias=partyquest

      - name: Build AAB (bundle for Play Store)
        working-directory: ./partyquest
        run: |
          cd platforms/android && ./gradlew bundleRelease \
            -Dorg.gradle.project.storeFile=$GITHUB_WORKSPACE/partyquest.keystore \
            -Dorg.gradle.project.storePassword=partyquest123 \
            -Dorg.gradle.project.keyAlias=partyquest \
            -Dorg.gradle.project.keyPassword=partyquest123

      - name: List build outputs
        run: |
          echo "=== Searching for APK/AAB files ==="
          find partyquest/platforms/android -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: partyquest/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: partyquest/platforms/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
