name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Create Bubblewrap config
        run: |
          python3 << 'PYEOF'
          import json, os
          
          config = {
              "jdkPath": "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64",
              "androidSdkPath": "/usr/local/lib/android/sdk",
              "manifest": {
                  "startUrl": "https://ariqureshi73.github.io/party-quest",
                  "name": "Party Quest",
                  "shortName": "Party Quest",
                  "display": "standalone",
                  "backgroundColor": "#000000",
                  "themeColor": "#2563eb"
              },
              "signing": {
                  "keystore": os.environ['GITHUB_WORKSPACE'] + '/partyquest.keystore',
                  "keyAlias": "partyquest",
                  "keyPassword": "partyquest123",
                  "storePassword": "partyquest123"
              },
              "packageId": "app.partyquest.ttrpg",
              "appVersion": "1.0.0",
              "appVersionCode": 1
          }
          
          with open('./bubblewrap-config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print("Config created")
          PYEOF

      - name: Init Bubblewrap with config
        run: |
          cd $GITHUB_WORKSPACE
          bubblewrap init \
            --jdk_path "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64" \
            --android_sdk_path "/usr/local/lib/android/sdk" \
            --manifest https://ariqureshi73.github.io/party-quest/manifest.json \
            --directory ./twa
        env:
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: Build APK + AAB
        working-directory: ./twa
        run: |
          bubblewrap build \
            --keystore $GITHUB_WORKSPACE/partyquest.keystore \
            --keystore_password partyquest123 \
            --key_password partyquest123 \
            --key_alias partyquest
        env:
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find ./twa -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | head -20
          echo ""
          echo "=== Full twa directory ==="
          ls -lah ./twa/ 2>/dev/null || echo "twa dir not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: twa/app-release-signed.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: twa/app-release-bundle.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore (save this!)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
