name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install minimal Android toolchain
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "tools"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.jks \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest,OU=PartyQuest,O=PartyQuest,L=Camas,ST=WA,C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v -keystore $GITHUB_WORKSPACE/partyquest.jks -alias partyquest -storepass partyquest123 | grep "SHA256:" || echo "Fingerprint extraction may have failed"
          echo "================================="

      - name: Initialize Bubblewrap (non-interactive)
        run: |
          # Auto-answer all Bubblewrap prompts
          yes n | bubblewrap init \
            --manifest https://ariqureshi73.github.io/party-quest/manifest.json \
            --directory ./twa || true
        env:
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: Configure signing in TWA manifest
        run: |
          python3 << 'PYEOF'
          import json
          manifest_file = './twa/twa-manifest.json'
          try:
              with open(manifest_file) as f:
                  manifest = json.load(f)
          except:
              print("twa-manifest.json not found, creating default")
              manifest = {}
          
          manifest['signingMode'] = 'local'
          manifest['signing'] = {
              'keystore': '${{ github.workspace }}/partyquest.jks',
              'keyAlias': 'partyquest',
              'keyPassword': 'partyquest123',
              'storePassword': 'partyquest123'
          }
          manifest['packageId'] = 'app.partyquest.ttrpg'
          
          with open(manifest_file, 'w') as f:
              json.dump(manifest, f, indent=2)
          print("Manifest configured")
          PYEOF

      - name: Build APK and AAB
        working-directory: ./twa
        run: yes n | bubblewrap build 2>&1 || true
        env:
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: Find and list built artifacts
        run: |
          echo "=== APK Files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== AAB Files ==="
          find . -name "*.aab" -type f 2>/dev/null || echo "No AAB found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: '**/*.apk'
          if-no-files-found: warn

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: '**/*.aab'
          if-no-files-found: warn

      - name: Upload keystore
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.jks
