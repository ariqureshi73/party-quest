name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Init Bubblewrap (non-interactive)
        run: |
          # Export to suppress interactive prompts
          export JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
          # Use yes command to auto-answer all prompts with "y" initially, then pipe final answers
          (echo n && yes) | bubblewrap init \
            --manifest https://ariqureshi73.github.io/party-quest/manifest.json \
            --directory ./twa 2>&1 || true
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: Check TWA directory
        run: ls -la ./twa/ | head -20

      - name: Build APK + AAB
        working-directory: ./twa
        run: |
          if [ -f "twa-manifest.json" ]; then
            echo "Found twa-manifest.json"
            # Patch it with signing config
            python3 << 'PYEOF'
import json
m = json.load(open('twa-manifest.json'))
m['signingMode'] = 'local'
m['packageId'] = 'app.partyquest.ttrpg'
json.dump(m, open('twa-manifest.json', 'w'), indent=2)
PYEOF
          fi
          (echo n && yes) | bubblewrap build 2>&1 || true
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: List all outputs
        run: |
          echo "=== Checking for outputs ==="
          find . -name "*.apk" -o -name "*.aab" -o -name "*.jks" 2>/dev/null | head -20
          echo ""
          echo "=== TWA contents ==="
          ls -la ./twa/ 2>/dev/null | tail -20 || echo "No twa dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-quest-apk
          path: |
            twa/**/*.apk
            twa/**/*-signed.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-quest-aab
          path: |
            twa/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
