name: Build Party Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11 (compatible with Android SDK)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Create Android project structure
        run: |
          mkdir -p android/app
          cd android
          
          # Create minimal gradle wrapper
          mkdir -p gradle/wrapper
          curl -s https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-8.0/* gradle/wrapper/
          
          # Create settings.gradle
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          
          # Create build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          EOF
          
          # Create app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "app.partyquest.ttrpg"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          # Create minimal AndroidManifest.xml
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="app.partyquest.ttrpg">
              <application
                  android:label="Party Quest"
                  android:theme="@style/Theme.AppCompat.Light">
              </application>
          </manifest>
          EOF

      - name: Generate signing keystore
        run: |
          cd android
          keytool -genkeypair -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore release.keystore -storepass partyquest123 -keypass partyquest123 \
            -dname "CN=Party Quest,O=PartyQuest,C=US" -noprompt

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true
        env:
          GRADLE_OPTS: "-Xmx4g"
          SKIP_JDK_VERSION_CHECK: 'true'

      - name: Find and copy APK
        run: |
          find android -name "*.apk" -type f
          mkdir -p dist
          find android -name "app-release.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: dist/app-release.apk
          if-no-files-found: warn
