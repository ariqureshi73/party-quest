name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create party-quest-twa app.partyquest.ttrpg "Party Quest"
          cd party-quest-twa
          cordova platform add android

      - name: Copy app files
        run: |
          cp ${{ github.workspace }}/index.html party-quest-twa/www/index.html
          cp ${{ github.workspace }}/manifest.json party-quest-twa/www/manifest.json

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print keystore fingerprint
        run: |
          keytool -list -v \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"

      - name: Build APK
        working-directory: party-quest-twa
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/11.0.31-11/x64
        run: |
          cordova build android --release -- \
            --keystore=${{ github.workspace }}/partyquest.keystore \
            --storePassword=partyquest123 \
            --alias=partyquest \
            --password=partyquest123

      - name: List generated files
        run: find party-quest-twa -name "*.apk" -o -name "*.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: party-quest-twa/platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: party-quest-twa/platforms/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
