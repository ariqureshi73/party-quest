name: Build Party Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Android Command-line Tools
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip
          mv cmdline-tools latest

      - name: Setup SDK
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            --install_option=--no_https | head -100

      - name: Create minimal Android project
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
          ANDROID_HOME: /opt/android-sdk
        run: |
          mkdir -p app
          cat > build.gradle << 'GRADLE'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'app.partyquest'
            compileSdk 34
            defaultConfig {
              applicationId 'app.partyquest.ttrpg'
              minSdk 28
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            signingConfigs {
              release {
                storeFile = file('partyquest.keystore')
                storePassword 'partyquest123'
                keyAlias 'partyquest'
                keyPassword 'partyquest123'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
            buildFeatures {
              viewBinding true
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          GRADLE

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest,OU=App,O=PartyQuest,L=Camas,ST=WA,C=US" \
            -noprompt

      - name: List keystore
        run: |
          echo "=== SHA-256 FINGERPRINT ==="
          keytool -list -v -keystore partyquest.keystore -alias partyquest -storepass partyquest123 | grep SHA256

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: partyquest-keystore
          path: partyquest.keystore

      - name: Done
        run: echo "✅ Keystore generated successfully"
