name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (API 34)
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ${{ runner.temp }}/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=Development, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print signing fingerprint
        run: |
          keytool -list -v \
            -keystore ${{ runner.temp }}/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep -A 2 "SHA256:"

      - name: Create build directory
        run: mkdir -p build

      - name: Create minimal build.gradle.kts
        run: cat > build/build.gradle.kts << 'GRADLE'
plugins {
    id("com.android.application")
}

android {
    compileSdk = 34
    namespace = "app.partyquest.ttrpg"

    defaultConfig {
        applicationId = "app.partyquest.ttrpg"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            isMinifyEnabled = false
            signingConfig = signingConfigs.release
        }
    }

    signingConfigs {
        create("release") {
            keyAlias = "partyquest"
            keyPassword = "partyquest123"
            storeFile = file("${{ runner.temp }}/partyquest.keystore")
            storePassword = "partyquest123"
        }
    }

    packagingOptions {
        exclude("META-INF/proguard/androidx-*.pro")
    }
}
GRADLE

      - name: Create minimal AndroidManifest.xml
        run: |
          mkdir -p build/src/main
          cat > build/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="app.partyquest.ttrpg">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Party Quest"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

      - name: Create settings.gradle.kts
        run: cat > build/settings.gradle.kts << 'GRADLE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "PartyQuest"
GRADLE

      - name: Build APK with Gradle
        working-directory: build
        run: ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: ${{ runner.temp }}/partyquest.keystore
          retention-days: 30
