name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Create Capacitor project structure
        run: |
          mkdir -p party-quest-app/src
          cp index.html manifest.json party-quest-app/src/
          
          # Create capacitor.config.json
          cat > party-quest-app/capacitor.config.json << 'JSON'
          {
            "appId": "app.partyquest.ttrpg",
            "appName": "Party Quest",
            "webDir": "src",
            "server": {
              "url": "https://ariqureshi73.github.io/party-quest",
              "cleartext": false
            },
            "plugins": {}
          }
          JSON

      - name: Initialize Capacitor Android
        working-directory: party-quest-app
        run: |
          npx @capacitor/cli add android --web-dir=src

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Get SHA-256 Fingerprint
        run: |
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:" | tee sha256.txt

      - name: Configure Gradle for Release Build
        working-directory: party-quest-app/android
        run: |
          mkdir -p gradle_props
          cat > local.properties << 'PROPS'
          sdk.dir=$ANDROID_HOME
          org.gradle.jvmargs=-Xmx2048m
          PROPS
          
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2048m
          PROPS

      - name: Build APK (Gradle)
        working-directory: party-quest-app/android
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs=-Xmx2048m \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            -PversionCode=1 \
            -PversionName=1.0.0 \
            -Psigning.keystore=$GITHUB_WORKSPACE/partyquest.keystore \
            -Psigning.keyAlias=partyquest \
            -Psigning.keyPassword=partyquest123 \
            -Psigning.storePassword=partyquest123 \
            assemble Release 2>&1 | tee build.log

      - name: Find APK Output
        run: |
          find party-quest-app -name "*.apk" -o -name "*.aab"
          ls -lah party-quest-app/android/app/build/outputs/apk/release/ 2>/dev/null || echo "APK dir not found"
          ls -lah party-quest-app/android/app/build/outputs/bundle/ 2>/dev/null || echo "Bundle dir not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: party-quest-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: party-quest-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore

      - name: Upload SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: sha256-fingerprint
          path: sha256.txt
