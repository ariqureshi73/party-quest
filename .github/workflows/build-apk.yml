name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.0.10792818'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create pq "app.partyquest.ttrpg" "Party Quest"
          cd pq
          cordova platform add android

      - name: Add Party Quest web content
        run: |
          cp index.html pq/www/
          cp manifest.json pq/www/

      - name: Generate keystore (non-interactive)
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Configure Cordova build settings
        run: |
          cd pq
          cat > build.json << 'JSONEOF'
          {
            "android": {
              "release": {
                "keystore": "$GITHUB_WORKSPACE/partyquest.keystore",
                "storePassword": "partyquest123",
                "alias": "partyquest",
                "password": "partyquest123",
                "keystoreType": "jks"
              }
            }
          }
          JSONEOF

      - name: Build signed APK (Cordova)
        run: |
          cd pq
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          cordova build android --release -- --keystore=$GITHUB_WORKSPACE/partyquest.keystore --storePassword=partyquest123 --alias=partyquest --password=partyquest123
        env:
          GRADLE_USER_HOME: /github/workspace/.gradle

      - name: Find and rename APK
        run: |
          find pq -name "*.apk" -type f
          ls -lah pq/platforms/android/app/build/outputs/apk/release/
          # Copy to workspace root for easy access
          cp pq/platforms/android/app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/party-quest.apk || echo "APK not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: party-quest.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore (SAVE THIS!)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
