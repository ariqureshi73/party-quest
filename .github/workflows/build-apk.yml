name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 34
          build-tools: 34.0.0

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $HOME/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print keystore fingerprint
        run: |
          keytool -list -v \
            -keystore $HOME/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep -A2 "SHA256:"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create twa app.partyquest.ttrpg "Party Quest"
          cd twa
          cordova platform add android

      - name: Copy web files
        run: |
          cp index.html twa/www/
          cp manifest.json twa/www/
          if [ -f *.js ]; then cp *.js twa/www/; fi
          if [ -f *.css ]; then cp *.css twa/www/; fi

      - name: Configure Cordova for signing
        run: |
          cat > twa/build.json << 'JSONEOF'
          {
            "android": {
              "release": {
                "keystore": "$HOME/partyquest.keystore",
                "storePassword": "partyquest123",
                "alias": "partyquest",
                "password": "partyquest123"
              }
            }
          }
          JSONEOF

      - name: Build APK (Cordova)
        run: |
          cd twa
          cordova build android --release -- --keystore=$HOME/partyquest.keystore --storePassword=partyquest123 --alias=partyquest --password=partyquest123

      - name: Find APK
        run: find twa -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: twa/platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: ${{ env.HOME }}/partyquest.keystore
          retention-days: 30
