name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Create Cordova project
        run: cordova create partyquest app.partyquest.ttrpg 'Party Quest'

      - name: Add Android platform
        run: cd partyquest && cordova platform add android

      - name: Copy HTML
        run: cp index.html partyquest/www/index.html

      - name: Build APK
        run: cd partyquest && cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: partyquest/platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
