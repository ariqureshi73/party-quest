name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true
        
      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          echo "SDK setup complete"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Create Cordova project
        run: |
          cordova create party-quest-twa app.partyquest.ttrpg "Party Quest"
          cd party-quest-twa
          cordova platform add android@latest
          
      - name: Copy web app to www
        run: |
          cp index.html party-quest-twa/www/index.html
          mkdir -p party-quest-twa/www/assets
          cp manifest.json party-quest-twa/www/ 2>/dev/null || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print keystore fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Build APK + AAB
        working-directory: ./party-quest-twa
        run: |
          cordova build android --release -- --keystore=${{ github.workspace }}/partyquest.keystore --storePassword=partyquest123 --alias=partyquest --password=partyquest123
          echo "Build complete. Artifacts:"
          ls -lah platforms/android/app/build/outputs/ 2>/dev/null || echo "Output dir not found"

      - name: List generated artifacts
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: party-quest-twa/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: party-quest-twa/platforms/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
