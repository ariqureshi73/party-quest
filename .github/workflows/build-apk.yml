name: Build Party Quest APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          apt-get update && apt-get install -y gradle

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Init Capacitor project
        run: |
          mkdir -p capacitor-app
          cd capacitor-app
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap init Party Quest app.partyquest.ttrpg

      - name: Copy web files
        run: |
          mkdir -p capacitor-app/www
          cp index.html capacitor-app/www/
          cp manifest.json capacitor-app/www/
          # Create basic styles if needed
          cat > capacitor-app/www/index.css << 'CSS'
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: Arial, sans-serif; }
          CSS
          cp capacitor-app/www/index.css .

      - name: Add Android platform
        run: |
          cd capacitor-app
          npx cap add android

      - name: Patch Android build config
        run: |
          python3 << 'PYEOF'
          import os, json
          
          # Update capacitor.config.json with signing config
          config_path = 'capacitor-app/capacitor.config.json'
          with open(config_path) as f:
              config = json.load(f)
          
          config['plugins'] = {}
          
          with open(config_path, 'w') as f:
              json.dump(config, f, indent=2)
          
          # Update Android gradle
          build_gradle = 'capacitor-app/android/build.gradle'
          with open(build_gradle) as f:
              gradle = f.read()
          
          # Inject signing config
          signing_config = '''
          
          android {
              signingConfigs {
                  release {
                      keyAlias 'partyquest'
                      keyPassword 'partyquest123'
                      storeFile file(System.getenv('KEYSTORE_PATH') ?: '/root/partyquest.keystore')
                      storePassword 'partyquest123'
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''
          
          if 'signingConfigs' not in gradle:
              gradle += signing_config
          
          with open(build_gradle, 'w') as f:
              f.write(gradle)
          
          print("✅ Build config patched")
          PYEOF

      - name: Build APK
        working-directory: ./capacitor-app/android
        run: |
          ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: /root/partyquest.keystore

      - name: List outputs
        run: find ./capacitor-app/android -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "Checking..."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: 'capacitor-app/android/app/build/outputs/apk/release/*.apk'
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
