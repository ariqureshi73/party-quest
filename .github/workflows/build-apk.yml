name: Build Party Quest APK with EAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with EAS
        run: |
          eas build --platform android --wait --non-interactive
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Download APK
        run: |
          # EAS builds are downloaded automatically to ./build
          ls -la build/ || echo "No build artifacts found"

      - name: Upload to GitHub Releases (optional)
        uses: softprops/action-gh-release@v2
        with:
          files: build/**/*.apk
          draft: true
        if: always()
