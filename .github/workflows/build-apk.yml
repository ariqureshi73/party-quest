name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 11 (Android SDK compatible)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Init Bubblewrap (non-interactive)
        run: |
          printf 'n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | \
            bubblewrap init \
              --manifest https://ariqureshi73.github.io/party-quest/manifest.json \
              --directory ./twa
        env:
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: Patch TWA manifest with keystore config
        run: |
          python3 << 'PYEOF'
          import json, os
          
          manifest_path = './twa/twa-manifest.json'
          with open(manifest_path) as f:
              m = json.load(f)
          
          m['signingMode'] = 'local'
          m['signing'] = {
              'keystore': os.environ['GITHUB_WORKSPACE'] + '/partyquest.keystore',
              'keyAlias': 'partyquest',
              'keyPassword': 'partyquest123',
              'storePassword': 'partyquest123'
          }
          m['packageId'] = 'app.partyquest.ttrpg'
          m['name'] = 'Party Quest'
          m['launcherName'] = 'Party Quest'
          
          with open(manifest_path, 'w') as f:
              json.dump(m, f, indent=2)
          
          print("✅ Manifest configured for signing")
          PYEOF

      - name: Build APK + AAB
        working-directory: ./twa
        run: |
          printf 'n\n' | bubblewrap build
        env:
          BUBBLEWRAP_SKIP_LATEST_VERSION_CHECK: 'true'

      - name: List build outputs
        run: find ./twa -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || echo "No APK/AAB found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: twa/app-release-signed.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: twa/app-release-bundle.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore (SAVE THIS!)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
