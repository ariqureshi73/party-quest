name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Android tools
        run: |
          npm install -g cordova
          # Use pre-installed Android SDK
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

      - name: Create Cordova project
        run: |
          cordova create party-quest-twa app.partyquest.ttrpg "Party Quest"
          cd party-quest-twa
          cordova platform add android
          
      - name: Copy web app into Cordova
        run: |
          cp ../index.html ./party-quest-twa/www/index.html
          cp ../manifest.json ./party-quest-twa/www/manifest.json

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest,OU=App,O=PartyQuest,L=Camas,ST=WA,C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Build APK (release)
        working-directory: ./party-quest-twa
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          cordova build android --release \
            --keystore=$GITHUB_WORKSPACE/partyquest.keystore \
            --storePassword=partyquest123 \
            --alias=partyquest \
            --password=partyquest123

      - name: List generated APK
        run: |
          find ./party-quest-twa -name "*.apk" -type f
          ls -lh ./party-quest-twa/platforms/android/app/build/outputs/apk/release/ || echo "Release APK not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: party-quest-twa/platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
