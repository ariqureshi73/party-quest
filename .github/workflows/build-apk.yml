name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"
          sdkmanager "cmdline-tools;latest"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest, OU=App, O=PartyQuest, L=Camas, ST=WA, C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          echo "====== SHA-256 FINGERPRINT ======"
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "================================="

      - name: Clone Bubblewrap repo
        run: |
          git clone https://github.com/GoogleChromeLabs/bubblewrap.git
          cd bubblewrap
          npm install

      - name: Create Bubblewrap project (non-interactive)
        working-directory: ./bubblewrap
        run: |
          node packages/cli/dist/src/main.js init \
            --manifest https://ariqureshi73.github.io/party-quest/manifest.json \
            --directory ../twa \
            --jdkPath /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64 || true

      - name: Check TWA structure
        run: |
          ls -la twa/ || echo "TWA dir not created"
          [ -f twa/twa-manifest.json ] && echo "✅ twa-manifest.json exists" || echo "❌ twa-manifest.json missing"

      - name: Patch manifest with signing config
        run: |
          python3 << 'PYEOF'
          import json, os
          
          manifest_path = 'twa/twa-manifest.json'
          if not os.path.exists(manifest_path):
              print("ERROR: twa-manifest.json not found!")
              print("Contents of twa/:", os.listdir('twa') if os.path.exists('twa') else 'twa/ missing')
              exit(1)
          
          with open(manifest_path) as f:
              m = json.load(f)
          
          # Add signing config
          m['signingMode'] = 'local'
          m['packageId'] = 'app.partyquest.ttrpg'
          
          with open(manifest_path, 'w') as f:
              json.dump(m, f, indent=2)
          
          print("✅ Manifest patched")
          PYEOF

      - name: Build with Gradle (via Bubblewrap)
        working-directory: ./bubblewrap
        run: |
          node packages/cli/dist/src/main.js build \
            --directory ../twa \
            --jdkPath /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64 || true

      - name: Find APK/AAB output
        run: |
          echo "Searching for build outputs..."
          find twa -type f \( -name "*.apk" -o -name "*.aab" \) -ls 2>/dev/null || echo "No APK/AAB found"
          echo ""
          echo "Full twa directory:"
          find twa -type f 2>/dev/null | head -20

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: twa/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: twa/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
