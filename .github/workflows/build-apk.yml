name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          $ANDROID_HOME/tools/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "extras;google;google_play_services" \
            "extras;android;m2repository"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore $GITHUB_WORKSPACE/partyquest.jks \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest,OU=Dev,O=PartyQuest,L=Camas,ST=WA,C=US" \
            -noprompt

      - name: Print signing certificate fingerprint
        run: |
          echo "========== SHA-256 Fingerprint =========="
          keytool -list -v \
            -keystore $GITHUB_WORKSPACE/partyquest.jks \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"
          echo "========================================"

      - name: Clone Chromium Web Activity template
        run: |
          git clone --depth 1 https://github.com/GoogleChromeLabs/chromium-web-activity.git cwa-template

      - name: Configure CWA for Party Quest
        run: |
          python3 << 'PYEOF'
          import json, os, shutil
          
          # Copy template to build dir
          src_manifest = './cwa-template/app/src/main/AndroidManifest.xml'
          src_build = './cwa-template/app/build.gradle.kts'
          
          # Use template's gradle setup
          shutil.copytree('./cwa-template/app', './app', dirs_exist_ok=True)
          shutil.copytree('./cwa-template/gradle', './gradle', dirs_exist_ok=True)
          shutil.copy('./cwa-template/build.gradle.kts', './build.gradle.kts')
          shutil.copy('./cwa-template/settings.gradle.kts', './settings.gradle.kts')
          shutil.copy('./cwa-template/gradlew', './gradlew')
          shutil.copy('./cwa-template/gradlew.bat', './gradlew.bat')
          os.chmod('./gradlew', 0o755)
          
          # Update manifest to point to our website
          manifest_path = './app/src/main/AndroidManifest.xml'
          with open(manifest_path) as f:
              content = f.read()
          
          # Replace package name and start URL
          content = content.replace(
              'com.example.cwa',
              'app.partyquest.ttrpg'
          )
          content = content.replace(
              'https://example.com',
              'https://ariqureshi73.github.io/party-quest'
          )
          
          with open(manifest_path, 'w') as f:
              f.write(content)
          
          print("✅ CWA configured for Party Quest")
          PYEOF

      - name: Build APK with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/partyquest.jks \
            -Pandroid.injected.signing.store.password=partyquest123 \
            -Pandroid.injected.signing.key.alias=partyquest \
            -Pandroid.injected.signing.key.password=partyquest123

      - name: Build AAB (Play Store bundle)
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/partyquest.jks \
            -Pandroid.injected.signing.store.password=partyquest123 \
            -Pandroid.injected.signing.key.alias=partyquest \
            -Pandroid.injected.signing.key.password=partyquest123

      - name: Find and rename outputs
        run: |
          find . -name "*.apk" -type f
          find . -name "*.aab" -type f
          
          # Move to workspace root with standard names
          mkdir -p outputs
          find . -name "*release.apk" -exec cp {} outputs/party-quest.apk \;
          find . -name "*release.aab" -exec cp {} outputs/party-quest.aab \;
          ls -lh outputs/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: outputs/party-quest.apk
          if-no-files-found: warn

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-aab
          path: outputs/party-quest.aab
          if-no-files-found: warn

      - name: Upload signing keystore
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.jks
          retention-days: 90
