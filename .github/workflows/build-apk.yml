name: Build Party Quest APK with Expo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Expo CLI
        run: npm install -g eas-cli

      - name: Create Expo project from web files
        run: |
          mkdir -p party-quest-expo
          cd party-quest-expo
          npx create-expo-app@latest . --template
          cp ../index.html ./App.web.js || true
          
      - name: Build APK with EAS (local build)
        run: |
          cd party-quest-expo
          # Use local Gradle build instead of EAS cloud
          npx eas build --platform android --local --wait || true
          
      - name: Fallback: Simple APK wrapper
        run: |
          # If EAS fails, create a simple Android wrapper APK
          mkdir -p android-wrapper
          cd android-wrapper
          
          # Download Gradle directly from a mirror
          curl -L "https://gradle.org/release/latest-release-candidate.zip" \
            -o gradle.zip || \
            echo "Gradle download failed, will use system gradle"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            party-quest-expo/.expo/
            party-quest-expo/build/
          retention-days: 7
