name: Build Party Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 11 (Android SDK compatible)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias partyquest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -storepass partyquest123 \
            -keypass partyquest123 \
            -dname "CN=Party Quest,OU=App,O=PartyQuest,L=Camas,ST=WA,C=US" \
            -noprompt

      - name: Print SHA-256 fingerprint
        run: |
          keytool -list -v \
            -keystore ${{ github.workspace }}/partyquest.keystore \
            -alias partyquest \
            -storepass partyquest123 | grep "SHA256:"

      - name: Create native Android project
        run: |
          mkdir -p android_app/app/src/main/{java/app/partyquest,res/{layout,values,drawable}}
          
          # Minimal build.gradle
          cat > android_app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace "app.partyquest.ttrpg"
              compileSdk 34
              buildToolsVersion "34.0.0"
              
              defaultConfig {
                  applicationId "app.partyquest.ttrpg"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              signingConfigs {
                  release {
                      storeFile file("${{ github.workspace }}/partyquest.keystore")
                      storePassword "partyquest123"
                      keyAlias "partyquest"
                      keyPassword "partyquest123"
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          GRADLE
          
          # settings.gradle
          echo "include ':app'" > android_app/settings.gradle
          
          # Root build.gradle
          cat > android_app/build.gradle.kts << 'KGRADL'
          plugins {
              id("com.android.application") version "8.2.0" apply false
          }
          KGRADL

      - name: Build APK with Gradle
        working-directory: ./android_app
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx4096m"

      - name: Find APK
        run: find ./android_app -name "*release*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-apk
          path: android_app/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload keystore (save this!)
        uses: actions/upload-artifact@v4
        with:
          name: party-quest-keystore
          path: partyquest.keystore
          retention-days: 30
